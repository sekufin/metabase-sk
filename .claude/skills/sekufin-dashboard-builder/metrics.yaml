# Métricas canónicas de Sekufin
#
# Cada entrada define una métrica de negocio con:
#   definicion:            qué mide en lenguaje de negocio
#   sinonimos:             formas en las que los usuarios pueden pedirla
#   sql_base:              query canónica (parametrizable con {placeholders})
#   dimensiones:           cortes típicos (para GROUP BY)
#   requiere_periodo:      si necesita un rango de fechas (true/false)
#   output_column:         cómo DEBE llamarse la columna resultado (convención
#                          para que default_viz_settings matchee)
#   default_viz_settings:  config a mergear en el visualization_settings del
#                          card. Incluye currency, scale, axis titles. El
#                          agente debe copiarlo completo al crear el card.
#   notas:                 ambigüedades, limitaciones, gotchas
#
# El agente usa lookup_metric(name) para recuperar la entrada. Cuando encuentra
# un default_viz_settings, lo usa como base y solo agrega graph.dimensions /
# graph.metrics según el shape final de su SQL.

produccion:
  definicion: |
    Prima emitida en un período. Incluye tanto pólizas nuevas como
    renovaciones — ambas son "pluma" que genera ingreso para la agencia.
  sinonimos: [emision, emisión, pluma, ventas_nuevas, negocios, produccion_nueva, producción]
  sql_base: |
    SELECT sum(prima) AS produccion
    FROM analytics.polizas
    WHERE fecha_desde BETWEEN {start} AND {end}
  output_column: produccion
  dimensiones:
    - "ramo"
    - "date_trunc('month', fecha_desde)"
    - "date_trunc('quarter', fecha_desde)"
    - "aseguradora_nombre"
    - "linea_negocio"
  requiere_periodo: true
  default_viz_settings:
    column_settings:
      '["name","produccion"]':
        number_style: currency
        currency: MXN
        currency_style: symbol
        currency_in_header: false
        scale: 0.000001
        suffix: M
        decimals: 2
    graph.y_axis.title_text: "Producción (MXN, millones)"
  notas: |
    - No filtrar por numero_renovacion (no confiable).
    - Para "producción NUEVA sin renovaciones", agregar estatus <> 'Renovada'
      como aproximación — advertir imprecisión.
    - Para cortar por asesor (comercial interno) usar analytics.polizas_resumen
      en vez de analytics.polizas — pero perderás dimensión temporal.
    - default_viz_settings abrevia a millones (scale 1e-6). Si la produccion
      es < $100K, quita scale+suffix para mostrar pesos completos.

conservacion:
  definicion: |
    Porcentaje de pólizas cuya vigencia terminó en el periodo y fueron
    renovadas. Mide la capacidad de retener clientes al vencimiento.
  sinonimos: [retencion, retención, renovacion_rate, tasa_de_renovacion, conservación]
  sql_base: |
    SELECT
      count(*) FILTER (WHERE estatus = 'Renovada') * 1.0
        / NULLIF(count(*), 0) AS conservacion
    FROM analytics.polizas
    WHERE fecha_hasta BETWEEN {start} AND {end}
  output_column: conservacion
  dimensiones:
    - "ramo"
    - "aseguradora_nombre"
    - "date_trunc('quarter', fecha_hasta)"
  requiere_periodo: true
  default_viz_settings:
    column_settings:
      '["name","conservacion"]':
        number_style: percent
        decimals: 1
    graph.y_axis.title_text: "% Conservación"
  notas: |
    - El SQL de arriba es aproximación. Para reporte oficial de bono en Vida,
      prefiere bonos_metas.base_conservada / base_a_conservar.
    - "Renovada" significa que la póliza FUE reemplazada, no que renovó.

cumplimiento_meta:
  definicion: |
    Porcentaje de meta alcanzada por ramo y periodo. El numerador varía
    por ramo: Daños usa negocios_totales, Vida base_conservada, GMM
    primas_netas_pagadas.
  sinonimos: [pct_meta, cumplimiento, meta_alcanzada, avance_meta, "% de meta"]
  sql_base: |
    -- Daños (cuatrimestral, por negocios)
    SELECT ramo, anio, periodo_tipo, periodo_num,
           negocios_totales * 1.0 / NULLIF(meta, 0) AS pct_cumplimiento
    FROM analytics.bonos_metas
    WHERE ramo = 'Daños' AND anio = {anio};
  output_column: pct_cumplimiento
  dimensiones:
    - "ramo"
    - "anio"
    - "periodo_num"
    - "aseguradora"
  requiere_periodo: false
  default_viz_settings:
    column_settings:
      '["name","pct_cumplimiento"]':
        number_style: percent
        decimals: 1
    graph.y_axis.title_text: "% Cumplimiento de meta"
    graph.goal_value: 1.0
    graph.show_goal: true
    graph.goal_label: "Meta 100%"
  notas: |
    - Si el usuario pide "cumplimiento" sin ramo, arma dashboard con una card
      por ramo (porque la fórmula cambia).
    - Para GMM/Autos, revisa BusinessConcepts ("prima_de_ubicacion") — puede
      haber definición específica del negocio.

integralidad_promedio:
  definicion: |
    Promedio de ramos distintos por cliente (rango 1-4). Mayor integralidad
    = cliente más valioso, menos churneable.
  sinonimos: [integralidad_media, ramos_por_cliente, multi_ramo]
  sql_base: |
    SELECT avg(integralidad)::numeric(4,2) AS integralidad_promedio
    FROM analytics.clientes
    WHERE es_contratante = true
  output_column: integralidad_promedio
  dimensiones:
    - "asesor"
  requiere_periodo: false
  default_viz_settings:
    column_settings:
      '["name","integralidad_promedio"]':
        number_style: decimal
        decimals: 2
    graph.y_axis.title_text: "Integralidad promedio (ramos)"
  notas: |
    - Filtrar por es_contratante=true para excluir asegurados/beneficiarios.
    - Distribución típica: ~60% integralidad=1, ~25% =2, ~10% =3, ~5% =4.

ticket_promedio:
  definicion: |
    Prima promedio por póliza. Indicador de ticket/ARPU de las pólizas
    activas.
  sinonimos: [prima_promedio, avg_prima, ticket_medio, prima_media, ARPU]
  sql_base: |
    SELECT avg(prima)::numeric(12,2) AS ticket_promedio
    FROM analytics.polizas
    WHERE estatus = 'Vigente'
  output_column: ticket_promedio
  dimensiones:
    - "ramo"
    - "aseguradora_nombre"
    - "linea_negocio"
    - "date_trunc('year', fecha_desde)"
  requiere_periodo: false
  default_viz_settings:
    column_settings:
      '["name","ticket_promedio"]':
        number_style: currency
        currency: MXN
        currency_style: symbol
        currency_in_header: false
        decimals: 0
    graph.y_axis.title_text: "Ticket promedio (MXN)"
  notas: |
    - Filtra estatus='Vigente' por default.
    - GMM 3-5x más alto que Autos; agrupa por ramo para evitar promedios
      engañosos si mezclas.
